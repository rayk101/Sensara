name: Sensara checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elderwatch-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elderwatch-ai/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NOTIFICATION_WORKER_ENABLED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
